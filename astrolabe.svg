<svg viewBox="0 0 900 620" width="100%" xmlns="http://www.w3.org/2000/svg" style="border-radius:16px; display:block; max-width:1000px;">
  <defs>
    <!-- sun core -->
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="24%"  stop-color="#FEF3C7"/>
      <stop offset="52%"  stop-color="#FCD34D"/>
      <stop offset="76%"  stop-color="#F59E0B" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FCD34D" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D4A054" stop-opacity="0.42"/>
      <stop offset="60%"  stop-color="#D4A054" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#D4A054" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlowA"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="bigGlowA"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="900" height="620" fill="#0A0202"/>

  <!-- starfield -->
  <g fill="#E8E0D0">
    <circle cx="42"  cy="58"  r="0.9" opacity="0.5"/>
    <circle cx="128" cy="402" r="1.0" opacity="0.55"/>
    <circle cx="212" cy="96"  r="0.8" opacity="0.45"/>
    <circle cx="88"  cy="238" r="1.1" opacity="0.6"/>
    <circle cx="176" cy="472" r="0.9" opacity="0.5"/>
    <circle cx="300" cy="42"  r="1.0" opacity="0.55"/>
    <circle cx="368" cy="580" r="0.8" opacity="0.45"/>
    <circle cx="520" cy="28"  r="1.1" opacity="0.6"/>
    <circle cx="608" cy="596" r="0.9" opacity="0.5"/>
    <circle cx="676" cy="52"  r="1.0" opacity="0.55"/>
    <circle cx="748" cy="568" r="0.8" opacity="0.45"/>
    <circle cx="812" cy="112" r="1.1" opacity="0.6"/>
    <circle cx="838" cy="298" r="0.9" opacity="0.5"/>
    <circle cx="866" cy="432" r="1.0" opacity="0.55"/>
    <circle cx="756" cy="218" r="0.8" opacity="0.45"/>
    <circle cx="548" cy="538" r="1.0" opacity="0.55"/>
    <circle cx="256" cy="352" r="0.9" opacity="0.5"/>
    <circle cx="142" cy="130" r="1.0" opacity="0.55"/>
    <circle cx="34"  cy="352" r="0.8" opacity="0.45"/>
    <circle cx="862" cy="58"  r="0.9" opacity="0.5"/>
  </g>

  <!-- twinkling stars -->
  <g fill="#FFFFFF">
    <circle cx="96"  cy="130" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="228" cy="80"  r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="120" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="816" cy="392" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.6s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="500" r="1.1"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="586" cy="580" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.0s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="342" cy="26"  r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="778" cy="60"  r="1.0"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.4s" begin="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═══ SLOW ROTATING RAYS ═══ -->
  <g transform="translate(450 310)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="180s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(30)"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(60)"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(90)"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(120)"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(150)"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(180)"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(210)"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(240)"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(270)"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(300)"/>
      <line x1="0" y1="0" x2="0" y2="-280" stroke="url(#rayFade)" stroke-width="0.8" transform="rotate(330)"/>
    </g>
  </g>

  <!-- ═══ OUTER RING ═══ -->
  <g transform="translate(450 310)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="140s" repeatCount="indefinite"/>
      <circle r="240" fill="none" stroke="#8B0000" stroke-width="0.6" opacity="0.65"/>
      <circle r="240" fill="none" stroke="#D4A054" stroke-width="0.6" stroke-dasharray="2 12" opacity="0.9"/>
    </g>
  </g>

  <!-- ═══ ZODIAC RING ═══ -->
  <g transform="translate(450 310)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="100s" repeatCount="indefinite"/>
      <circle r="200" fill="none" stroke="#D4A054" stroke-width="0.7" opacity="0.55"/>
      <circle r="200" fill="none" stroke="#E8590C" stroke-width="1.4" stroke-dasharray="4 62" opacity="0.95"/>
      <circle cx="0" cy="-200" r="3" fill="#D4A054"/>
      <circle cx="100" cy="-173" r="3" fill="#D4A054"/>
      <circle cx="173" cy="-100" r="3" fill="#D4A054"/>
      <circle cx="200" cy="0" r="3" fill="#D4A054"/>
      <circle cx="173" cy="100" r="3" fill="#D4A054"/>
      <circle cx="100" cy="173" r="3" fill="#D4A054"/>
      <circle cx="0" cy="200" r="3" fill="#D4A054"/>
      <circle cx="-100" cy="173" r="3" fill="#D4A054"/>
      <circle cx="-173" cy="100" r="3" fill="#D4A054"/>
      <circle cx="-200" cy="0" r="3" fill="#D4A054"/>
      <circle cx="-173" cy="-100" r="3" fill="#D4A054"/>
      <circle cx="-100" cy="-173" r="3" fill="#D4A054"/>
    </g>
  </g>

  <!-- ═══ INNER RING ═══ -->
  <g transform="translate(450 310)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
      <circle r="148" fill="none" stroke="#E8590C" stroke-width="0.6" stroke-dasharray="1 5" opacity="0.75"/>
    </g>
  </g>

  <!-- ═══ ORBITAL DOTS ═══ -->
  <g transform="translate(450 310)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/><circle cx="148" cy="0" r="2.4" fill="#FCD34D" filter="url(#softGlowA)"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/><circle cx="200" cy="0" r="3" fill="#F472B6" filter="url(#softGlowA)"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/><circle cx="240" cy="0" r="2.2" fill="#22D3EE" filter="url(#softGlowA)"/></g>
  </g>

  <!-- ═══ COMPASS ROSE ═══ -->
  <g transform="translate(450 310)">
    <g fill="#D4A054">
      <polygon points="0,-100 6,-30 0,-26 -6,-30" opacity="0.95"/>
      <polygon points="0,100 6,30 0,26 -6,30" opacity="0.95"/>
      <polygon points="100,0 30,6 26,0 30,-6" opacity="0.95"/>
      <polygon points="-100,0 -30,6 -26,0 -30,-6" opacity="0.95"/>
      <polygon points="70,-70 24,-14 20,-20 14,-24" opacity="0.7"/>
      <polygon points="-70,-70 -24,-14 -20,-20 -14,-24" opacity="0.7"/>
      <polygon points="70,70 24,14 20,20 14,24" opacity="0.7"/>
      <polygon points="-70,70 -24,14 -20,20 -14,24" opacity="0.7"/>
    </g>
    <g fill="#8B0000" opacity="0.9">
      <polygon points="0,-76 4,-26 0,-22 -4,-26"/>
      <polygon points="0,76 4,26 0,22 -4,26"/>
      <polygon points="76,0 26,4 22,0 26,-4"/>
      <polygon points="-76,0 -26,4 -22,0 -26,-4"/>
    </g>
    <circle r="108" fill="none" stroke="#D4A054" stroke-width="0.6" opacity="0.7"/>
  </g>

  <!-- ═══ CENTRAL SUN ═══ -->
  <circle cx="450" cy="310" r="130" fill="url(#sunHalo)" filter="url(#bigGlowA)"/>
  <circle cx="450" cy="310" r="70" fill="url(#sunCore)" filter="url(#bigGlowA)">
    <animate attributeName="r" values="68;78;68" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="310" r="22" fill="#FEF3C7">
    <animate attributeName="r" values="20;25;20" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="310" r="11" fill="#FFFFFF"/>

  <circle cx="450" cy="310" r="30" fill="none" stroke="#FCD34D" stroke-width="0.8" opacity="0.6">
    <animate attributeName="r" values="30;240" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="310" r="30" fill="none" stroke="#F59E0B" stroke-width="0.8" opacity="0.45">
    <animate attributeName="r" values="30;280" dur="7s" begin="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0" dur="7s" begin="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ═══ ENGRAVED TEXT MARKS ═══ -->
  <g font-family="'Cinzel', 'Lora', Georgia, serif" font-size="11" letter-spacing="3" fill="#D4A054" opacity="0.65" text-anchor="middle">
    <text x="450" y="102">· SEPTENTRIO ·</text>
    <text x="450" y="536">· MERIDIES ·</text>
    <text x="180" y="315" transform="rotate(-90 180 315)">· ORIENS ·</text>
    <text x="720" y="315" transform="rotate(90 720 315)">· OCCIDENS ·</text>
  </g>

  <text x="450" y="600" text-anchor="middle" font-family="'Lora', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" letter-spacing="0.6" fill="#D4A054" opacity="0.85">
    “Deterministic where it matters — probabilistic where it counts.”
  </text>
</svg>
