<svg viewBox="0 0 900 620" width="100%" xmlns="http://www.w3.org/2000/svg" style="border-radius:16px; display:block;">
  <defs>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="24%" stop-color="#FEF3C7"/>
      <stop offset="52%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlowA"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="bigGlowA"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="900" height="620" fill="#0A0202"/>

  <!-- starfield -->
  <g fill="#E8E0D0">
    <circle cx="42" cy="58" r="0.9" opacity="0.5"/>
    <circle cx="128" cy="402" r="1.0" opacity="0.55"/>
    <circle cx="812" cy="112" r="1.1" opacity="0.6"/>
    <circle cx="866" cy="432" r="1.0" opacity="0.55"/>
  </g>

  <!-- twinkling stars -->
  <g fill="#FFFFFF">
    <circle cx="96" cy="130" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="120" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═══ OUTER RING ═══ -->
  <g transform="translate(450 310)">
    <animateTransform attributeName="transform" type="rotate" from="0 450 310" to="360 450 310" dur="140s" repeatCount="indefinite"/>
    <circle r="240" fill="none" stroke="#8B0000" stroke-width="0.6" opacity="0.65"/>
    <circle r="240" fill="none" stroke="#D4A054" stroke-width="0.6" stroke-dasharray="2 12" opacity="0.9"/>
  </g>

  <!-- ═══ ZODIAC RING ═══ -->
  <g transform="translate(450 310)">
    <animateTransform attributeName="transform" type="rotate" from="360 450 310" to="0 450 310" dur="100s" repeatCount="indefinite"/>
    <circle r="200" fill="none" stroke="#E8590C" stroke-width="1.4" stroke-dasharray="4 62" opacity="0.95"/>
  </g>

  <!-- ═══ COMPASS ROSE ═══ -->
  <g transform="translate(450 310)">
    <g fill="#D4A054">
      <polygon points="0,-100 6,-30 0,-26 -6,-30" opacity="0.95"/>
      <polygon points="0,100 6,30 0,26 -6,30" opacity="0.95"/>
      <polygon points="100,0 30,6 26,0 30,-6" opacity="0.95"/>
      <polygon points="-100,0 -30,6 -26,0 -30,-6" opacity="0.95"/>
    </g>
    <circle r="108" fill="none" stroke="#D4A054" stroke-width="0.6" opacity="0.7"/>
  </g>

  <!-- ═══ CENTRAL SUN ═══ -->
  <circle cx="450" cy="310" r="70" fill="url(#sunCore)" filter="url(#bigGlowA)">
    <animate attributeName="r" values="68;78;68" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <text x="450" y="600" text-anchor="middle" font-family="'Lora', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#D4A054" opacity="0.85">
    “Deterministic where it matters — probabilistic where it counts.”
  </text>
</svg>
